name: Tests

on:
  push:
    branches:
      - 'master'
      - '[0-9].[0-9]+'
  pull_request: ~

jobs:
  tests:
    name: ${{ matrix.php }} / ${{ matrix.symfony }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            symfony: '~5.4.0'
            deps: 'normal'
          - php: '8.3'
            symfony: '~5.4.0'
            deps: 'low'
          - php: '8.4'
            symfony: '~7.4.0'
            deps: 'normal'
          - php: '8.5'
            symfony: '~8.1.0'
            deps: 'normal'

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer --version
      - run: composer validate --strict

      # Install Flex as a global dependency to enable usage of extra.symfony.require
      # while keeping Flex recipes from applying
      - run: composer global config --no-plugins allow-plugins.symfony/flex true
      - run: composer global require --no-scripts symfony/flex

      - run: composer config extra.symfony.require ${{ matrix.symfony }}

      - run: composer update --prefer-dist
        if: ${{ matrix.deps != 'low' }}

      - run: composer update --prefer-dist --prefer-lowest --prefer-stable
        if: ${{ matrix.deps == 'low' }}

      - run: vendor/bin/phpunit -c phpunit.xml --colors=always
